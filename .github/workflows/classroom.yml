name: GitHub Classroom Workflow
on:
  push:
    branches: [ master ]
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Check Docker Hub secrets
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is empty"
            exit 1
          fi
          if [ -z "$DH_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN is empty"
            exit 1
          fi
          echo "Both Docker Hub secrets are available"
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Library Service
        uses: docker/build-push-action@v6
        with:
          context: ./v4/library_service
          push: true
          tags: progsa/library-service:${{ github.sha }}

      - name: Build and push Reservation Service
        uses: docker/build-push-action@v6
        with:
          context: ./v4/reservation_service
          push: true
          tags: progsa/reservation-service:${{ github.sha }}

      - name: Build and push Rating Service
        uses: docker/build-push-action@v6
        with:
          context: ./v4/rating_service
          push: true
          tags: progsa/rating-service:${{ github.sha }}

      - name: Build and push Gateway Service
        uses: docker/build-push-action@v6
        with:
          context: ./v4/gateway_service
          push: true
          tags: progsa/gateway-service:${{ github.sha }}
      
      - name: Install cloudlogin
        run: |
          curl -fsSLO \
            https://github.com/cloud-ru-tech/cloudlogin/releases/latest/download/cloudlogin_Linux_amd64.tar.gz
          tar -xzf cloudlogin_Linux_amd64.tar.gz
          sudo install -m 0755 cloudlogin /usr/local/bin/cloudlogin
          cloudlogin help

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      
      - name: Configure Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET_ID: ${{ secrets.CLOUDRU_SECRET_ID }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBECONFIG_B64" \
            | base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          ruby -ryaml -e '
            path = ENV.fetch("HOME") + "/.kube/config"
            config = YAML.load_file(path)

            config.fetch("users").each do |entry|
              exec = entry.dig("user", "exec")
              next unless exec && exec["command"] == "cloudlogin"

              exec["env"] ||= []

              %w[CLOUDRU_KEY_ID CLOUDRU_SECRET_ID].each do |name|
                exec["env"].reject! { |item| item["name"] == name }
                exec["env"] << {
                  "name" => name,
                  "value" => ENV.fetch(name)
                }
              end
            end

            File.write(path, config.to_yaml)
          '

          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

          kubectl config current-context
          kubectl get nodes

      - name: Create test namespace
        run: kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: |
          helm upgrade --install postgres k8s/postgres \
            -n test --wait --timeout 3m

      - name: Deploy services
        env:
          NAMESPACE: test
          IMAGE_TAG: ${{ github.sha }}
        timeout-minutes: 20
        run: |
          for service in library rating reservation gateway; do
            echo "=== Deploying $service ==="

            if ! helm upgrade --install "$service" k8s/service \
              -n "$NAMESPACE" \
              -f "k8s/values/$service.yaml" \
              --set image.tag="$IMAGE_TAG" \
              --wait --timeout 5m; then

              echo "=== Pods ==="
              kubectl get pods -n "$NAMESPACE" -o wide

              echo "=== Deployments ==="
              kubectl get deployments -n "$NAMESPACE"

              echo "=== Recent events ==="
              kubectl get events -n "$NAMESPACE" \
                --sort-by=.metadata.creationTimestamp

              echo "=== Library pod description ==="
              kubectl describe pods -n "$NAMESPACE" \
                -l app.kubernetes.io/name=library

              exit 1
            fi
          done

      - name: Wait for services
        run: |
          for service in library rating reservation gateway; do
            kubectl rollout status deployment/"$service" \
              -n test --timeout=180s
          done

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v4/postman/collection.json
          environment: v4/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 5
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"